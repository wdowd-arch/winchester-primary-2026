<!--
  Winchester News — live results embed
  2nd & 5th Middlesex Senate primaries, Sept. 1, 2026

  Paste the whole file into ONE Ghost HTML card (type /html in the editor).
  Scripts do not run in the editing view - judge it from Preview or the
  published post. Ghost strips iframes and scripts from NEWSLETTER EMAILS,
  so put a plain paragraph link to the live page next to this card for
  email readers.

  The fixed heights only cover the first moment of load (phones run taller
  because everything wraps). After that the widget posts its exact height on
  every render and the script below resizes the frame to match, so the
  article grows with the count and there is never an inner scrollbar.
-->

<style>
  #senate-results { width: 100%; height: 2100px; border: 0; display: block; overflow: hidden; }
  @media (max-width: 640px) { #senate-results { height: 2900px; } }
</style>

<iframe id="senate-results"
        src="https://wdowd-arch.github.io/winchester-primary-2026/"
        title="Live results: 2nd and 5th Middlesex state Senate primaries"
        scrolling="no"></iframe>

<script>
(function () {
  var frame = document.getElementById('senate-results');
  var ORIGIN = 'https://wdowd-arch.github.io';

  window.addEventListener('message', function (e) {
    // Only this widget may resize this iframe: right origin, and the message
    // must come from this frame rather than any other frame on the page.
    if (e.origin !== ORIGIN) return;
    if (!frame || e.source !== frame.contentWindow) return;

    var h = e.data && e.data.winchesterHeight;
    if (typeof h !== 'number' || !isFinite(h)) return;

    // Sane bounds, so a bad value cannot blow up the article layout.
    frame.style.height = Math.min(Math.max(Math.round(h), 400), 12000) + 'px';
  });
})();
</script>
